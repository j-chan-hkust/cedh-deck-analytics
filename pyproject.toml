[project]
name = "cedh-analyzer"
version = "2.0.0"
description = "A terminal UI tool for analyzing competitive EDH (cEDH) decklists from tournament data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
    "pyfiglet>=1.0.2",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.15.0",
    "selenium-stealth>=1.0.6",
    "webdriver-manager>=4.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyperclip>=1.8.2",
    "httpx>=0.25.0",
    "rich>=13.7.0",
    "darkdetect>=0.8.0",
]

[project.scripts]
cedh = "cedh_analyzer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cedh_analyzer"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
